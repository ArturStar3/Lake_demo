services:
  demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    image: ${DEMO_IMAGE:-infolake-demo:latest}
    pull_policy: never
    restart: unless-stopped
    stop_grace_period: 120s
    env_file:
      - ${DEMO_ENV_FILE:-.env.demo}
    ports:
      - "${DEMO_HTTP_PORT:-8080}:80"
      - "127.0.0.1:${DEMO_DB_PORT:-55432}:5432"
    volumes:
      - type: bind
        source: ${MBTILES_PATH:?Set MBTILES_PATH in .env.demo}
        target: /data/data/map.mbtiles
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_PATH:?Set MEDIA_PATH in .env.demo}
        target: /app/media
        bind:
          create_host_path: false
      - type: bind
        source: ${DB_DUMP_PATH:?Set DB_DUMP_PATH in .env.demo}
        target: /restore/db_dump
        read_only: true
        bind:
          create_host_path: false
      - pgdata:/var/lib/postgresql/data
    networks:
      integration:
        aliases:
          - infolake-demo
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/tiles/styles/infolake-unified/style.json && wget -q -S -O /dev/null http://127.0.0.1/api/v1/ 2>&1 | grep -q 'HTTP/'"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s

volumes:
  pgdata:
    name: ${DEMO_PG_VOLUME:-infolake_demo_pgdata}

networks:
  integration:
    external: true
    name: ${DEMO_NETWORK:-infolake-integration}
